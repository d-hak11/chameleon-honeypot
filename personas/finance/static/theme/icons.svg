    <symbol id="i-user" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-8 2-8 5.5V20h16v-1.5C20 15 16 13 12 13Z"/>
