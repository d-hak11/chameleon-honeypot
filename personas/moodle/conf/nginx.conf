# Greenwood College persona -- nginx backend serving a coherent Moodle identity.
# Configured from observations of real Moodle deployments (see evidence/moodle/EVIDENCE.md).
#
# Notes:
#  - server_tokens off -> the Server header is just "nginx", exactly as the official
#    Moodle demo (sandbox.moodledemo.net) presents itself behind nginx.
#  - Moodle-invariant headers below were observed across multiple real Moodle hosts,
#    so they belong to the persona layer (the backend), not to the proxy in front.
#  - The MoodleSession cookie value uses $request_id: nginx generates 32 hexadecimal
#    characters per request, which is exactly the shape of a real Moodle session token.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html/static;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log off;

    # nginx's static-file handler only accepts GET/HEAD by default and
    # returns 405 for POST -- but the real login form (and the Phase 8
    # admin-login honeytrap) both POST to a plain static page. This is
    # the standard nginx workaround: treat the 405 as a normal request
    # and retry serving the same static file.
    error_page 405 =200 $uri;

    # --- Moodle-invariant response headers (applied to all responses, incl. errors) ---
    add_header content-language en always;
    add_header content-script-type text/javascript always;
    add_header content-style-type text/css always;
    add_header x-ua-compatible "IE=edge" always;
    add_header cache-control "no-store, no-cache, must-revalidate, no-transform" always;
    add_header pragma no-cache always;
    add_header expires "Mon, 20 Aug 1969 09:23:00 GMT" always;
    add_header accept-ranges none always;
    add_header x-frame-options sameorigin always;
    add_header Set-Cookie "MoodleSession=$request_id; path=/" always;
    # Phase 8 honeytrap: a fake preference cookie, HMAC-signed with a fixed
    # payload/mac pair (proxy/traps/ verifies it, never issues it). Detects
    # a client that edits an opaque-looking cookie value rather than
    # leaving it alone -- see personas/moodle/manifest.yml's `traps:` block.
    add_header Set-Cookie "MOODLE_PREF=light.6711c0acd4b553c1135da2bb20edac09712ff2c891754a446425da1251a98860; path=/" always;

    # --- Themed Moodle error pages ---
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /error.html;

    location = /403.html  { internal; }
    location = /404.html  { internal; }
    location = /error.html { internal; }

    # --- Map familiar Moodle URLs onto the static persona ---
    location = /login/index.php { try_files /login.html =404; }
    location = /index.php       { try_files /index.html =404; }

    # --- Phase 8 honeytrap: fake admin login (personas/moodle/manifest.yml
    # `traps.admin_login_path`). Resolves the real `Disallow: /admin/`
    # robots.txt entry. GET serves the login form; POST always serves a
    # plausible post-auth rejection regardless of what was submitted --
    # proxy/traps/ (Caddy layer) is what distinguishes the planted weak
    # credential from any other attempt in the log, not this content. ---
    # POST is rewritten to GET /admin/rejected.html by Caddy (proxy/caddy.json)
    # before it reaches here, so this location only ever sees GET.
    location = /admin/index.php { try_files /admin/index.html =404; }

    location = / { try_files /index.html =404; }

    # --- Generic static content (also rewrites extensionless to .html) ---
    location / {
        try_files $uri $uri.html =404;
    }
}
