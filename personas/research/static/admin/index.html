<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin sign in | Greenwood Research Portal</title>
    <link rel="shortcut icon" href="../favicon.svg">
    <link rel="stylesheet" type="text/css" href="../theme/styles.css">
</head>
<body id="page-admin-index" class="path-admin dir-ltr lang-en">

<nav class="navbar" aria-label="Site navigation">
    <a class="navbar-brand" href="../index.php">
        <span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="../theme/icons.svg#i-cap"/></svg></span>
        <span>Greenwood Research Portal</span>
    </a>
</nav>

<div class="login-container">
    <div class="login-brand">
        <svg class="icon" aria-hidden="true"><use href="../theme/icons.svg#i-lock-open"/></svg>
    </div>

    <div class="alert alert-danger" id="gc-login-alert" role="alert"></div>

    <form class="login-form" action="index.php" method="post" id="adminlogin">
        <h1 class="login-title">Administration sign in</h1>
        <p class="logininfo">Restricted area. Authorised staff only.</p>

        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-control"
                   value="" placeholder="Enter your username" autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" id="password" value=""
                   class="form-control" placeholder="Enter your password" autocomplete="current-password">
        </div>

        <div class="login-actions">
            <button type="submit" class="btn btn-primary btn-block" id="loginbtn">
                <span class="btn-label">Log in</span>
            </button>
        </div>
    </form>
</div>

</body>
</html>
